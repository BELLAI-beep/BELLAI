<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BELLAI 관리자</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

/* 로그인 */
#login-screen{position:fixed;inset:0;background:#0a0a0f;display:flex;align-items:center;justify-content:center;z-index:100}
.login-box{background:#111827;border:1px solid rgba(124,106,247,.3);border-radius:20px;padding:40px;width:340px;text-align:center}
.login-box h2{font-size:22px;margin-bottom:8px;color:#fff}
.login-box p{font-size:13px;color:#6b7280;margin-bottom:24px}
.login-input{width:100%;background:#1f2937;border:1px solid #374151;border-radius:10px;padding:12px 16px;color:#fff;font-size:14px;outline:none;margin-bottom:12px}
.login-input:focus{border-color:#7c6af7}
.login-btn{width:100%;background:#7c6af7;border:none;border-radius:10px;padding:12px;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.login-btn:hover{opacity:.9}
.login-err{color:#f87171;font-size:12px;margin-top:8px;min-height:16px}

/* 헤더 */
header{background:#111827;border-bottom:1px solid #1f2937;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
.header-logo{display:flex;align-items:center;gap:10px}
.header-logo svg{border-radius:8px}
.header-title{font-size:16px;font-weight:600;color:#fff}
.header-sub{font-size:12px;color:#6b7280}
.logout-btn{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:8px;padding:6px 14px;color:#f87171;font-size:12px;cursor:pointer}

/* 레이아웃 */
.container{max-width:1200px;margin:0 auto;padding:24px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}

/* 카드 */
.card{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:20px}
.card-title{font-size:13px;color:#6b7280;margin-bottom:4px;font-weight:500}
.card-value{font-size:28px;font-weight:700;color:#fff}
.card-sub{font-size:12px;color:#4b5563;margin-top:4px}
.card-icon{font-size:24px;margin-bottom:8px}

/* AI 카드 */
.ai-card{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:20px}
.ai-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ai-dot{width:10px;height:10px;border-radius:50%}
.ai-name{font-size:15px;font-weight:600;color:#fff}
.ai-model{font-size:11px;color:#6b7280}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1f2937}
.stat-row:last-child{border-bottom:none}
.stat-label{font-size:12px;color:#6b7280}
.stat-value{font-size:13px;font-weight:600;color:#e2e8f0}
.progress-bar{width:100%;height:4px;background:#1f2937;border-radius:2px;margin-top:12px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width .5s}

/* 섹션 타이틀 */
.section-title{font-size:16px;font-weight:600;color:#fff;margin-bottom:12px}

/* 오류 로그 */
.log-item{background:#1f2937;border-radius:8px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.log-badge{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;flex-shrink:0;margin-top:1px}
.log-badge.error{background:rgba(248,113,113,.2);color:#f87171}
.log-badge.warn{background:rgba(251,191,36,.2);color:#fbbf24}
.log-badge.ok{background:rgba(52,211,153,.2);color:#34d399}
.log-text{font-size:12px;color:#9ca3af;line-height:1.5}
.log-time{font-size:11px;color:#4b5563;margin-top:2px}

/* 새로고침 버튼 */
.refresh-btn{background:rgba(124,106,247,.1);border:1px solid rgba(124,106,247,.3);border-radius:8px;padding:6px 14px;color:#a78bfa;font-size:12px;cursor:pointer;float:right}

/* 사용자 테이블 */
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:12px;color:#6b7280;padding:8px 12px;border-bottom:1px solid #1f2937}
.table td{font-size:13px;color:#e2e8f0;padding:10px 12px;border-bottom:1px solid #1f2937}
.table tr:last-child td{border-bottom:none}

.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.status-ok{background:#34d399}
.status-err{background:#f87171}

#dashboard{display:none}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login-screen">
  <div class="login-box">
    <svg width="48" height="48" viewBox="0 0 120 120" style="margin:0 auto 16px;display:block">
      <rect width="120" height="120" rx="26" fill="#0e0f11"/>
      <line x1="60" y1="60" x2="60"  y2="14"  stroke="#c084fc" stroke-width="1.5" opacity=".6"/>
      <line x1="60" y1="60" x2="103" y2="21"  stroke="#34d399" stroke-width="1.5" opacity=".6"/>
      <line x1="60" y1="60" x2="106" y2="60"  stroke="#60a5fa" stroke-width="1.5" opacity=".6"/>
      <line x1="60" y1="60" x2="103" y2="99"  stroke="#fb923c" stroke-width="1.5" opacity=".6"/>
      <line x1="60" y1="60" x2="60"  y2="106" stroke="#f472b6" stroke-width="1.5" opacity=".6"/>
      <line x1="60" y1="60" x2="17"  y2="99"  stroke="#10b8d4" stroke-width="1.5" opacity=".6"/>
      <circle cx="60"  cy="14"  r="9" fill="#c084fc"/>
      <circle cx="103" cy="21"  r="9" fill="#34d399"/>
      <circle cx="106" cy="60"  r="9" fill="#60a5fa"/>
      <circle cx="103" cy="99"  r="9" fill="#fb923c"/>
      <circle cx="60"  cy="106" r="9" fill="#f472b6"/>
      <circle cx="17"  cy="99"  r="9" fill="#10b8d4"/>
      <circle cx="60"  cy="60"  r="12" fill="rgba(159,142,247,.2)"/>
      <circle cx="60"  cy="60"  r="8"  fill="white"/>
    </svg>
    <h2>BELLAI 관리자</h2>
    <p>관리자 전용 대시보드</p>
    <input class="login-input" id="admin-pw" type="password" placeholder="관리자 비밀번호"/>
    <button class="login-btn" onclick="adminLogin()">로그인</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- 대시보드 -->
<div id="dashboard">
  <header>
    <div class="header-logo">
      <svg width="32" height="32" viewBox="0 0 120 120">
        <rect width="120" height="120" rx="26" fill="#0e0f11"/>
        <circle cx="60" cy="14"  r="9" fill="#c084fc"/>
        <circle cx="103" cy="21" r="9" fill="#34d399"/>
        <circle cx="106" cy="60" r="9" fill="#60a5fa"/>
        <circle cx="103" cy="99" r="9" fill="#fb923c"/>
        <circle cx="60" cy="106" r="9" fill="#f472b6"/>
        <circle cx="17" cy="99"  r="9" fill="#10b8d4"/>
        <circle cx="60" cy="60"  r="8" fill="white"/>
      </svg>
      <div>
        <div class="header-title">BELLAI 관리자</div>
        <div class="header-sub" id="last-updated">로딩 중...</div>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">로그아웃</button>
  </header>

  <div class="container">

    <!-- 요약 카드 -->
    <div class="grid-4">
      <div class="card">
        <div class="card-icon">🤖</div>
        <div class="card-title">활성 AI</div>
        <div class="card-value" id="active-ai-count">4</div>
        <div class="card-sub">Claude · GPT · DeepSeek · Groq</div>
      </div>
      <div class="card">
        <div class="card-icon">💬</div>
        <div class="card-title">오늘 대화</div>
        <div class="card-value" id="today-chats">-</div>
        <div class="card-sub">Firebase 기준</div>
      </div>
      <div class="card">
        <div class="card-icon">👥</div>
        <div class="card-title">총 사용자</div>
        <div class="card-value" id="total-users">-</div>
        <div class="card-sub">가입 계정 수</div>
      </div>
      <div class="card">
        <div class="card-icon">⚡</div>
        <div class="card-title">서버 상태</div>
        <div class="card-value" id="server-status" style="font-size:16px;margin-top:4px">확인 중...</div>
        <div class="card-sub" id="server-latency">-</div>
      </div>
    </div>

    <!-- AI 상태 -->
    <div class="section-title">🤖 AI 연결 상태 <button class="refresh-btn" onclick="checkAIStatus()">새로고침</button></div>
    <div class="grid-2" id="ai-cards">
      <div class="ai-card"><div style="color:#6b7280;font-size:13px">로딩 중...</div></div>
      <div class="ai-card"><div style="color:#6b7280;font-size:13px">로딩 중...</div></div>
    </div>

    <!-- 오류 로그 -->
    <div class="section-title" style="margin-top:8px">📋 최근 오류 로그</div>
    <div class="card" id="error-log">
      <div style="color:#6b7280;font-size:13px;text-align:center;padding:20px">오류 없음 ✅</div>
    </div>

  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const ADMIN_PW = 'bellai2024!';

firebase.initializeApp({
  apiKey: "AIzaSyALyH50AJP1QQGlMqBy21YDn2Bn3vDRxbk",
  authDomain: "bellai-bd7d2.firebaseapp.com",
  projectId: "bellai-bd7d2",
});
const db = firebase.firestore();

const AI_CONFIG = [
  {id:'claude',   name:'Claude',   color:'#c084fc', model:'claude-sonnet-latest'},
  {id:'gpt',      name:'GPT',      color:'#34d399', model:'gpt-4o'},
  {id:'deepseek', name:'DeepSeek', color:'#fb923c', model:'deepseek-chat'},
  {id:'groq',     name:'Groq',     color:'#f472b6', model:'llama-3.3-70b'},
];

let errorLogs = [];

function adminLogin() {
  const pw = document.getElementById('admin-pw').value;
  if (pw === ADMIN_PW) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    initDashboard();
  } else {
    document.getElementById('login-err').textContent = '비밀번호가 틀렸습니다';
  }
}

function logout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('admin-pw').value = '';
}

document.getElementById('admin-pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') adminLogin();
});

async function initDashboard() {
  updateTime();
  await checkAIStatus();
  await loadFirebaseStats();
  setInterval(updateTime, 60000);
}

function updateTime() {
  const now = new Date();
  document.getElementById('last-updated').textContent =
    '마지막 업데이트: ' + now.toLocaleTimeString('ko-KR');
}

async function checkAIStatus() {
  const start = Date.now();
  try {
    const res = await fetch('/api/chat?status');
    const latency = Date.now() - start;
    const data = await res.json();

    document.getElementById('server-status').innerHTML =
      '<span class="status-dot status-ok"></span>정상';
    document.getElementById('server-latency').textContent = `응답 ${latency}ms`;

    const container = document.getElementById('ai-cards');
    container.innerHTML = '';

    AI_CONFIG.forEach((ai, i) => {
      const isActive = data.available && data.available.includes(ai.id);
      const model = data.models ? data.models[ai.id] : ai.model;
      const card = document.createElement('div');
      card.className = 'ai-card';
      card.innerHTML = `
        <div class="ai-header">
          <div class="ai-dot" style="background:${ai.color}"></div>
          <div>
            <div class="ai-name">${ai.name}</div>
            <div class="ai-model">${model || ai.model}</div>
          </div>
          <div style="margin-left:auto;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;
            background:${isActive ? 'rgba(52,211,153,.15)' : 'rgba(248,113,113,.15)'};
            color:${isActive ? '#34d399' : '#f87171'}">
            ${isActive ? '✅ 연결됨' : '❌ 오프라인'}
          </div>
        </div>
        <div class="stat-row">
          <span class="stat-label">상태</span>
          <span class="stat-value">${isActive ? '정상 운영 중' : '연결 불가'}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">모델</span>
          <span class="stat-value" style="font-size:11px">${model || '-'}</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${isActive ? '100' : '0'}%;background:${ai.color}"></div>
        </div>
      `;
      container.appendChild(card);
    });

    document.getElementById('active-ai-count').textContent =
      data.available ? data.available.length : 0;

  } catch(e) {
    const latency = Date.now() - start;
    document.getElementById('server-status').innerHTML =
      '<span class="status-dot status-err"></span>오류';
    document.getElementById('server-latency').textContent = `${latency}ms`;
    addErrorLog('서버 연결 오류: ' + e.message);
  }
}

async function loadFirebaseStats() {
  try {
    const usersSnap = await db.collectionGroup('conversations').get();
    document.getElementById('today-chats').textContent = usersSnap.size;

    // 사용자 수 카운트
    const usersRef = await db.collection('users').get();
    document.getElementById('total-users').textContent = usersRef.size;
  } catch(e) {
    document.getElementById('today-chats').textContent = '-';
    document.getElementById('total-users').textContent = '-';
  }
}

function addErrorLog(msg) {
  const now = new Date().toLocaleTimeString('ko-KR');
  errorLogs.unshift({msg, time: now, type: 'error'});
  if (errorLogs.length > 10) errorLogs.pop();
  renderErrorLog();
}

function renderErrorLog() {
  const el = document.getElementById('error-log');
  if (errorLogs.length === 0) {
    el.innerHTML = '<div style="color:#6b7280;font-size:13px;text-align:center;padding:20px">오류 없음 ✅</div>';
    return;
  }
  el.innerHTML = errorLogs.map(log => `
    <div class="log-item">
      <span class="log-badge ${log.type}">${log.type === 'error' ? 'ERROR' : 'WARN'}</span>
      <div>
        <div class="log-text">${log.msg}</div>
        <div class="log-time">${log.time}</div>
      </div>
    </div>
  `).join('');
}
</script>
</body>
</html>
